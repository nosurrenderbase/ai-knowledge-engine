# Redis for the knowledge base index (vectors + full-text). Loaded by compose.yaml.
# The index can always be rebuilt from git, but rebuilding re-embeds every chunk,
# so the data is kept durable: both AOF and RDB snapshots, on a host directory.

dir /data

# Append-only file: every write is logged, fsync once a second (at most ~1 s lost on a crash).
appendonly yes
appendfsync everysec
appenddirname appendonly
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a second copy (easy to back up or move: one file).
save 3600 1 300 100 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# Never evict: an evicted key would silently drop part of the index.
maxmemory 1gb
maxmemory-policy noeviction

# Only reachable through the published localhost port; the password comes from compose.
protected-mode yes
bind 0.0.0.0
port 6379
