# Long-running services of the engine (Redis, Postgres, MCP, panel, Cloudflare Tunnel). Data lives under work/ (git-ignored) so the
# whole setup moves to another machine by copying the repo, work/ and .env.
#
#   docker compose up -d        # start (containers restart on their own after a reboot)
#   docker compose ps
#   docker compose logs -f redis
#   docker compose up -d --build mcp panel   # after changing the MCP server, the panel or packages
#   docker compose logs -f cloudflared # tunnel status (public hostname is set in the Cloudflare dashboard)

name: ai-knowledge-engine

services:
  redis:
    image: redis:8.10.2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?.env içinde REDIS_PASSWORD tanımlı olmalı}"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./work/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    stop_grace_period: 30s

  # Users, per-person tokens and usage records (and later the admin panel).
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: kb
      POSTGRES_DB: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env içinde POSTGRES_PASSWORD tanımlı olmalı}
    volumes:
      - ./work/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-8787}:8787"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8787"
      # Old shared token, accepted during the switch to personal tokens; remove to turn it off.
      MCP_TOKEN: ${MCP_TOKEN:-}
      DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD}@postgres:5432/kb
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?.env içinde VOYAGE_API_KEY tanımlı olmalı}
      VOYAGE_API_URL: ${VOYAGE_API_URL}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4-large}
      # Game database, read-only user (optional): db_* tools for people with database access.
      MONGO_RO_URI: ${MONGO_RO_URI:-}
      MONGO_RO_DB: ${MONGO_RO_DB:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Admin panel (Next.js): users and tokens, usage, queries, search console.
  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PANEL_PORT:-3100}:3100"
    environment:
      PANEL_PASSWORD: ${PANEL_PASSWORD:?.env içinde PANEL_PASSWORD tanımlı olmalı}
      PANEL_SECRET: ${PANEL_SECRET:?.env içinde PANEL_SECRET tanımlı olmalı}
      DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD}@postgres:5432/kb
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_API_URL: ${VOYAGE_API_URL}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4-large}
      # Versions card: what the deploy job, the worker and the knowledge base clone say (read-only).
      DEPLOY_STATE_FILE: /data/deploy/state.json
      WORKER_STATE_DIR: /data/state
      KB_CLONE_DIR: /data/kb
      MCP_HEALTH_URL: http://mcp:8787/health
    volumes:
      - ./work/deploy:/data/deploy:ro
      - ./work/state:/data/state:ro
      - ./work/kb:/data/kb:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Cloudflare Tunnel: publishes the MCP server over HTTPS without opening any port on
  # this machine. Remotely managed: the public hostname → http://mcp:8787 route is set
  # in Cloudflare Zero Trust > Networks > Tunnels; only the token lives here.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?.env içinde CF_TUNNEL_TOKEN tanımlı olmalı}
